/* ============================================================
   Numbered — design tokens & components
   Navy surfaces, gold accent, editorial serif for display type.
   Series colours validated for CVD separation and contrast on
   both the light (#ffffff) and dark (#111c31) card surfaces.
   ============================================================ */

:root {
  color-scheme: light;

  --page: #eef2f8;
  --card: #ffffff;
  --card-2: #f6f8fc;
  --sunken: #e9eef6;

  --brand: #14315b;
  --brand-deep: #0e2444;
  --brand-soft: #e7eefa;
  --accent: #a97b16;
  --accent-mark: #d9a53c;
  --accent-soft: #fdf4e2;

  --text-1: #0f172a;
  --text-2: #47536b;
  --text-3: #6d7787;

  --line: rgba(15, 23, 42, 0.10);
  --line-strong: rgba(15, 23, 42, 0.18);
  --grid: #e5eaf2;
  --axis: #c6d0e0;

  --good: #0f7a2e;
  --crit: #b52d2d;

  --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.05), 0 2px 10px rgba(15, 23, 42, 0.045);
  --shadow-hero: 0 2px 4px rgba(14, 36, 68, 0.10), 0 12px 32px rgba(14, 36, 68, 0.12);
  --shadow-pop: 0 8px 28px rgba(15, 23, 42, 0.16);
  --overlay: rgba(15, 23, 42, 0.45);

  --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
  --sans: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --display-track: -0.008em;

  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;
  --r-sm: 6px; --r-md: 11px; --r-lg: 16px; --r-pill: 999px;
  --tap: 44px;
}

html[data-theme='dark'] {
  color-scheme: dark;

  --page: #070c16;
  --card: #111c31;
  --card-2: #16233c;
  --sunken: #1b2941;

  --brand: #7ea6dd;
  --brand-deep: #0c1526;
  --brand-soft: #1b2b48;
  --accent: #e7be63;
  --accent-mark: #e0b457;
  --accent-soft: #2a2312;

  --text-1: #f2f5fa;
  --text-2: #b7c0d0;
  --text-3: #8f99ab;

  --line: rgba(255, 255, 255, 0.11);
  --line-strong: rgba(255, 255, 255, 0.2);
  --grid: #22304a;
  --axis: #33456a;

  --good: #52c96a;
  --crit: #ef8181;

  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-hero: 0 8px 28px rgba(0, 0, 0, 0.5);
  --shadow-pop: 0 10px 30px rgba(0, 0, 0, 0.55);
  --overlay: rgba(3, 7, 15, 0.62);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  background: var(--page);
  color: var(--text-1);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

h1, h2, h3, h4 {
  margin: 0; font-family: var(--serif); font-weight: 600;
  letter-spacing: var(--display-track); line-height: 1.22;
}
h1 { font-size: 1.45rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0 0 var(--sp-3); }
p:last-child { margin-bottom: 0; }
a { color: var(--brand); }

:focus-visible { outline: 2px solid var(--accent-mark); outline-offset: 2px; border-radius: var(--r-sm); }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip-link {
  position: absolute; left: var(--sp-3); top: -60px; z-index: 100;
  background: var(--card); color: var(--text-1); padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-sm); box-shadow: var(--shadow-pop); transition: top 0.15s ease;
}
.skip-link:focus { top: var(--sp-3); }

/* ---------------- shell ---------------- */

.app { min-height: 100vh; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 30;
  background: var(--brand-deep); color: #fff;
  padding: var(--sp-3) var(--sp-4);
  padding-top: max(var(--sp-3), env(safe-area-inset-top));
  display: flex; align-items: center; gap: var(--sp-3);
}
html[data-theme='dark'] .topbar { border-bottom: 1px solid var(--line); }

.brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.brand__mark { color: #fff; flex: none; }
.brand__word {
  font-family: var(--serif); font-size: 1.12rem; font-weight: 600;
  letter-spacing: var(--display-track); color: #fff; line-height: 1;
}
.topbar__meta {
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.13em;
  text-transform: uppercase; color: #a8c0e0; white-space: nowrap;
}
.topbar__rule {
  height: 3px; width: 84px; flex: none; border-radius: 2px;
  background: rgba(255, 255, 255, 0.2); overflow: hidden;
}
.topbar__rule i { display: block; height: 100%; background: var(--accent-mark); }
.topbar__grow { flex: 1; min-width: 0; }
.topbar__meta { overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 560px) {
  .topbar__rule { display: none; }
  .topbar { gap: var(--sp-2); }
}

.iconbtn {
  appearance: none; background: rgba(255, 255, 255, 0.12); color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.18); border-radius: var(--r-md);
  min-width: 40px; height: 40px; padding: 0 var(--sp-2);
  display: inline-flex; align-items: center; justify-content: center;
  font: inherit; font-size: 0.85rem; cursor: pointer; transition: background 0.15s ease;
}
.iconbtn:hover { background: rgba(255, 255, 255, 0.22); }

.nav {
  position: sticky; top: 0; z-index: 20;
  background: var(--card); border-bottom: 1px solid var(--line);
  display: flex; gap: 2px; padding: 0 var(--sp-2);
  overflow-x: auto; scrollbar-width: none;
}
.nav::-webkit-scrollbar { display: none; }
.nav__item {
  appearance: none; background: none; border: 0; border-bottom: 2px solid transparent;
  color: var(--text-2); font: inherit; font-size: 0.9rem; font-weight: 500;
  padding: var(--sp-3); min-height: var(--tap); cursor: pointer; white-space: nowrap;
}
.nav__item:hover { color: var(--text-1); background: var(--card-2); }
.nav__item[aria-current='page'] {
  color: var(--text-1); border-bottom-color: var(--accent-mark); font-weight: 600;
}

.main {
  flex: 1; width: 100%; max-width: 1100px; margin: 0 auto;
  padding: var(--sp-4);
  padding-bottom: max(var(--sp-6), calc(env(safe-area-inset-bottom) + var(--sp-5)));
}

.stack { display: flex; flex-direction: column; gap: var(--sp-4); }
.stack--tight { gap: var(--sp-3); }
.row { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
.row--between { justify-content: space-between; }
.row--nowrap { flex-wrap: nowrap; }
.grow { flex: 1; min-width: 0; }

.grid { display: grid; gap: var(--sp-3); }
.grid--2 { grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 860px) { .grid--2 { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: var(--sp-4); } }

/* ---------------- cards ---------------- */

.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--shadow-card); padding: var(--sp-4);
}
.card--flush { padding: 0; overflow: hidden; }
.card__head {
  display: flex; align-items: flex-start; gap: var(--sp-3);
  margin-bottom: var(--sp-3); flex-wrap: wrap;
}
/* Let the actions drop below the title rather than squeezing it to three lines. */
.card__head > .grow { min-width: min(100%, 16rem); }
.card__title { font-family: var(--serif); font-size: 1rem; font-weight: 600; }
.card__sub { font-size: 0.8rem; color: var(--text-3); margin-top: 3px; font-family: var(--sans); }

.card--hero {
  background: linear-gradient(168deg, #16375f 0%, #0e2444 78%);
  border-color: transparent; color: #fff; box-shadow: var(--shadow-hero);
}
html[data-theme='dark'] .card--hero {
  background: linear-gradient(168deg, #1b2e4d 0%, #101a2c 80%);
  border-color: rgba(255, 255, 255, 0.08);
}
.card--hero .card__sub, .card--hero .muted { color: #b6c9e4; }

.label { font-size: 0.78rem; font-weight: 500; color: var(--text-2); }
.muted { color: var(--text-3); }
.small { font-size: 0.8rem; }
.tnum { font-variant-numeric: tabular-nums; }
.serif { font-family: var(--serif); }

/* ---------------- figures ---------------- */

.hero {
  font-family: var(--serif); font-size: 2.9rem; font-weight: 600;
  letter-spacing: var(--display-track); line-height: 1.02;
}
.hero-label {
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em;
  text-transform: uppercase; opacity: 0.78;
}
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat__label {
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text-3);
}
.stat__value {
  font-family: var(--serif); font-size: 1.5rem; font-weight: 600;
  letter-spacing: var(--display-track);
}
.stat__foot { font-size: 0.75rem; color: var(--text-3); }

.strip {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px;
  background: var(--line); border: 1px solid var(--line);
  border-radius: var(--r-lg); overflow: hidden;
}
@media (min-width: 720px) { .strip { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.strip__cell { background: var(--card); padding: var(--sp-3) var(--sp-4); }

/* ---------------- buttons & chips ---------------- */

.btn {
  appearance: none; font: inherit; font-size: 0.9rem; font-weight: 550;
  border-radius: var(--r-md); border: 1px solid var(--line-strong);
  background: var(--card); color: var(--text-1);
  min-height: var(--tap); padding: 0 var(--sp-4);
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  cursor: pointer; touch-action: manipulation;
  transition: background 0.15s ease, border-color 0.15s ease, transform 0.08s ease;
}
.btn:hover { background: var(--card-2); }
.btn:active { transform: translateY(1px); }
.btn--primary { background: var(--accent-mark); border-color: transparent; color: #2b1f05; font-weight: 650; }
.btn--primary:hover { background: #e2b355; }
.btn--navy { background: var(--brand-deep); border-color: var(--brand-deep); color: #fff; }
html[data-theme='dark'] .btn--navy { background: #2c4d80; border-color: #2c4d80; }
.btn--ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn--ghost:hover { background: var(--card-2); color: var(--text-1); }
.btn--sm { min-height: 36px; font-size: 0.82rem; padding: 0 var(--sp-3); }
.btn--danger { color: var(--crit); }
.btn--block { width: 100%; }
.btn[disabled] {
  background: transparent; color: var(--text-3);
  border: 1px dashed var(--line-strong); cursor: not-allowed;
}
.card--hero .btn { border-color: rgba(255,255,255,0.28); background: rgba(255,255,255,0.1); color: #fff; }
.card--hero .btn--primary { background: var(--accent-mark); border-color: transparent; color: #2b1f05; }

.chipbar { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
.chip {
  appearance: none; font: inherit; font-size: 0.82rem; cursor: pointer;
  background: var(--card-2); color: var(--text-2);
  border: 1px solid var(--line-strong); border-radius: var(--r-pill);
  min-height: 40px; padding: 0 14px;
  display: inline-flex; align-items: center; gap: 7px; touch-action: manipulation;
  transition: background 0.14s ease, color 0.14s ease;
}
.chip:hover { color: var(--text-1); }
.chip[disabled] { opacity: 0.45; cursor: not-allowed; }
.chip[disabled]:hover { color: var(--text-2); }
.chip[aria-pressed='true'] {
  background: var(--brand-soft); color: var(--text-1);
  border-color: currentColor; font-weight: 600;
}
.chip--dur { min-width: 58px; justify-content: center; font-variant-numeric: tabular-nums; }
.chip--ghost { background: transparent; border-style: dashed; }
.chip__dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

/* ---------------- quick log ---------------- */

.ql { display: grid; gap: var(--sp-3); }
.ql__step { display: grid; gap: 7px; }
.ql__legend {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--text-3);
  display: flex; align-items: center; gap: 7px;
}
.ql__num {
  width: 17px; height: 17px; border-radius: 50%; flex: none;
  background: var(--sunken); color: var(--text-2);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700;
}
.ql__num--on { background: var(--accent-mark); color: #1f1705; }
.ql__bar { display: flex; gap: var(--sp-2); }
.ql__bar .btn:first-child { flex: 1; }

/* ---------------- forms ---------------- */

.field { display: flex; flex-direction: column; gap: 6px; }
input[type='text'], input[type='number'], input[type='date'], textarea, select {
  /* iOS zooms the viewport when a focused field is under 16px. */
  font: inherit; font-size: max(16px, 0.95rem); color: var(--text-1);
  background: var(--card-2); border: 1px solid var(--line-strong);
  border-radius: var(--r-md); padding: 10px var(--sp-3); min-height: var(--tap); width: 100%;
}
textarea { min-height: 88px; resize: vertical; line-height: 1.55; }
input::placeholder, textarea::placeholder { color: var(--text-3); }

/* iOS Safari renders date inputs natively: they shrink-wrap to an intrinsic
   width far wider than other engines, ignore width:100% in flex/grid, and
   centre their value. Reset the native chrome and lay the value out ourselves. */
input[type='date'] {
  -webkit-appearance: none;
  appearance: none;
  display: block;
  width: 100%;
  min-width: 0;
  text-align: left;
  line-height: 1.25;
}
input[type='date']::-webkit-date-and-time-value {
  text-align: left;
  margin: 0;
  min-height: 1.25em;
}
input[type='date']::-webkit-datetime-edit { padding: 0; }
input[type='date']::-webkit-calendar-picker-indicator { opacity: 0.55; }

input:disabled { background: var(--sunken); color: var(--text-3); }

/* ---------------- entries ---------------- */

.entry {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: 10px 0; border-bottom: 1px solid var(--grid);
}
.entry:last-child { border-bottom: 0; }
.entry__bar { width: 3px; align-self: stretch; border-radius: 2px; flex: none; min-height: 32px; }
.entry__desc { font-size: 0.92rem; }
.entry__cat { font-size: 0.75rem; color: var(--text-3); }
.entry__note { font-size: 0.8rem; color: var(--text-2); margin-top: 2px; white-space: pre-wrap; }
.entry__min { font-size: 0.9rem; font-weight: 650; white-space: nowrap; font-variant-numeric: tabular-nums; }
.entry--new { animation: pop 0.32s ease; }
@keyframes pop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

/* ---------------- meters & split bar ---------------- */

.meter { display: grid; gap: 5px; }
.meter__top { display: flex; align-items: baseline; gap: var(--sp-2); font-size: 0.82rem; }
.meter__track { height: 8px; border-radius: var(--r-pill); background: var(--sunken); overflow: hidden; }
.card--hero .meter__track { background: rgba(255, 255, 255, 0.16); }
.meter__fill { height: 100%; border-radius: var(--r-pill); transition: width 0.35s ease; }

.split { display: flex; height: 26px; border-radius: var(--r-pill); overflow: hidden; gap: 2px; }
.split i { display: block; height: 100%; }

/* ---------------- habits ---------------- */

.habit-grid-wrap { width: 100%; }
.habit-grid { width: 100%; border-collapse: separate; border-spacing: 0; }
.habit-grid th, .habit-grid td { padding: 6px; text-align: center; }
.habit-grid th:first-child, .habit-grid td:first-child { text-align: left; padding-left: 0; }
.habit-grid thead th { font-size: 0.7rem; color: var(--text-2); font-weight: 600; }
.habit-grid tbody tr { border-top: 1px solid var(--grid); }
.habit-name { font-size: 0.86rem; font-weight: 500; }

.hbox {
  appearance: none; cursor: pointer; touch-action: manipulation; width: 40px; height: 40px;
  border-radius: var(--r-md); border: 1.5px solid var(--line-strong);
  background: var(--card-2); color: var(--text-3);
  font: inherit; font-size: 1rem;
  display: inline-flex; align-items: center; justify-content: center;
  transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
}
.hbox:hover { border-color: var(--brand); }
.hbox:active { transform: scale(0.94); }
.hbox[aria-pressed='true'] { background: var(--accent-mark); border-color: transparent; color: #1f1705; }

.htile {
  appearance: none; cursor: pointer; touch-action: manipulation; font: inherit;
  display: flex; align-items: center; gap: 9px; text-align: left;
  background: var(--card-2); color: var(--text-2);
  border: 1px solid var(--line-strong); border-radius: var(--r-md);
  min-height: 48px; padding: 0 11px; font-size: 0.85rem;
  transition: color 0.14s ease, border-color 0.14s ease;
}
.htile .grow { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.htile__tick {
  width: 21px; height: 21px; border-radius: 6px; flex: none;
  border: 1.5px solid var(--line-strong);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 12px; color: transparent;
}
.htile[aria-pressed='true'] { color: var(--text-1); }
.htile[aria-pressed='true'] .htile__tick {
  background: var(--accent-mark); border-color: transparent; color: #1f1705;
}
.htile-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); }
@media (min-width: 720px) { .htile-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

.heat { display: flex; flex-wrap: wrap; gap: 3px; }
.heat--cal {
  display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 13px);
  grid-auto-columns: 13px; gap: 3px; flex-wrap: nowrap;
  overflow-x: auto; padding-bottom: 4px;
}
.heat__cell {
  width: 13px; height: 13px; border-radius: 3px;
  background: var(--sunken); border: 1px solid transparent;
}
.heat--cal .heat__cell { width: 100%; height: 100%; }
.heat__cell--on { background: var(--brand); }
html[data-theme='dark'] .heat__cell--on { background: #4e8bde; }
.heat__cell--today { border-color: var(--accent-mark); }
.heat__cell--future { background: transparent; border: 1px dashed var(--grid); }
.heat__cell--pad { background: transparent; }
.heat__rows {
  display: grid; grid-template-rows: repeat(7, 13px); gap: 3px;
  font-size: 9px; color: var(--text-3); line-height: 13px; margin-right: 4px;
}

/* ---------------- badges, callouts ---------------- */

.badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.74rem; font-weight: 600; border-radius: var(--r-pill);
  padding: 4px 10px; background: var(--sunken); color: var(--text-2);
}
.badge--gold { background: var(--accent-soft); color: var(--accent); }
.badge--good { background: var(--sunken); color: var(--good); }

.callout {
  display: flex; gap: var(--sp-3); align-items: center;
  border: 1px solid var(--line); border-radius: var(--r-lg);
  background: var(--accent-soft); padding: var(--sp-3) var(--sp-4); font-size: 0.86rem;
}
.callout--info { background: var(--brand-soft); }
.callout--warn { background: var(--card); border-left: 3px solid var(--crit); }
.callout__sep { color: var(--text-3); }

.verse {
  font-family: var(--serif); font-style: italic; color: var(--text-2);
  font-size: 0.92rem; line-height: 1.5;
}
.verse__ref {
  display: block; font-family: var(--sans); font-style: normal;
  font-size: 10px; letter-spacing: 0.13em; text-transform: uppercase;
  color: var(--text-3); font-weight: 600; margin-top: 6px;
}

/* ---------------- charts ---------------- */

.chart-frame { width: 100%; }
.recharts-surface { overflow: visible; }
.recharts-cartesian-axis-tick text { font-size: 11px; fill: var(--text-3); font-variant-numeric: tabular-nums; }

.tip {
  background: var(--card); border: 1px solid var(--line-strong);
  border-radius: var(--r-md); box-shadow: var(--shadow-pop);
  padding: var(--sp-2) var(--sp-3); font-size: 0.8rem; min-width: 152px;
}
.tip__head { font-weight: 650; margin-bottom: 4px; }
.tip__row { display: flex; align-items: center; gap: var(--sp-2); padding: 1px 0; }
.tip__row .grow { color: var(--text-2); }
.tip__val { font-variant-numeric: tabular-nums; font-weight: 650; }

.legend { display: flex; flex-direction: column; gap: 6px; list-style: none; margin: 0; padding: 0; }
.legend__item { display: flex; align-items: center; gap: var(--sp-2); font-size: 0.82rem; }
.legend__name { color: var(--text-2); }
.legend__val { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 650; color: var(--text-1); }
.legend__pct { color: var(--text-3); width: 40px; text-align: right; font-variant-numeric: tabular-nums; font-size: 0.75rem; }

.swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; }
.swatch--line { width: 16px; height: 3px; border-radius: 2px; }
.swatch--lg { width: 18px; height: 18px; border-radius: 5px; }

.dtable { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
.dtable th, .dtable td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
.dtable th:first-child, .dtable td:first-child { text-align: left; }
.dtable thead th { color: var(--text-2); font-weight: 600; }
.dtable td { font-variant-numeric: tabular-nums; }
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }

/* ---------------- modal ---------------- */

.modal-backdrop {
  position: fixed; inset: 0; z-index: 60; background: var(--overlay);
  display: flex; align-items: flex-end; justify-content: center;
}
@media (min-width: 640px) { .modal-backdrop { align-items: center; padding: var(--sp-4); } }
.modal {
  background: var(--card); width: 100%; max-width: 520px;
  border-radius: var(--r-lg) var(--r-lg) 0 0; max-height: 92vh; overflow-y: auto;
  padding: var(--sp-4);
  padding-bottom: max(var(--sp-4), calc(env(safe-area-inset-bottom) + var(--sp-3)));
  box-shadow: var(--shadow-pop);
}
@media (min-width: 640px) { .modal { border-radius: var(--r-lg); } }

/* ---------------- wizard ---------------- */

.wizard { max-width: 640px; margin: 0 auto; padding: var(--sp-4); }
.wizard__steps { display: flex; gap: 6px; margin-bottom: var(--sp-4); }
.wizard__dot { flex: 1; height: 4px; border-radius: var(--r-pill); background: var(--sunken); }
.wizard__dot--on { background: var(--accent-mark); }
.wizard__dot--done { background: var(--brand); }

.listrow {
  display: flex; align-items: flex-start; gap: var(--sp-2);
  padding: var(--sp-3); border: 1px solid var(--line);
  border-radius: var(--r-md); background: var(--card);
}
.swatch-picker { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch-btn {
  appearance: none; cursor: pointer; width: 34px; height: 34px;
  border-radius: var(--r-md); border: 2px solid transparent; padding: 3px; background: var(--card-2);
}
.swatch-btn > span { display: block; width: 100%; height: 100%; border-radius: 5px; }
.swatch-btn[aria-pressed='true'] { border-color: var(--text-1); }

hr.sep { border: 0; border-top: 1px solid var(--line); margin: var(--sp-4) 0; }

/* ---------------- toast ---------------- */

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: max(var(--sp-4), calc(env(safe-area-inset-bottom) + var(--sp-3)));
  z-index: 80; background: var(--text-1); color: var(--card);
  padding: var(--sp-3) var(--sp-4); border-radius: var(--r-pill);
  font-size: 0.85rem; font-weight: 550; box-shadow: var(--shadow-pop);
  max-width: 92vw; display: flex; align-items: center; gap: var(--sp-3);
}
.toast button {
  appearance: none; background: none; border: 0; cursor: pointer;
  font: inherit; font-weight: 700; color: inherit; text-decoration: underline;
  padding: 2px 0; min-height: 0;
}

.empty { text-align: center; color: var(--text-3); font-size: 0.86rem; padding: var(--sp-5) var(--sp-3); }

@media print {
  .nav, .topbar, .btn, .chipbar, .toast { display: none !important; }
  .card { box-shadow: none; break-inside: avoid; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
